fidelity:
  divergences: >-
    The critical declaration exposes the arbitrary-multiplier, common-landing,
    centered-clock, trajectory-tube, relative-height, and intermediate-level
    first-passage package. The fixed-A declaration exposes the exact upper
    exceptional exponent and balanced joint ceiling, but uses a target constant
    C; the manuscript's normalization to target constant one is a separate
    terminal-rank adjustment. The reciprocal lower bound is explicitly joint
    and height-forced, so it does not claim a lower bound for target-only
    failure. The stretched declaration exposes every strict
    sigma < 1-delta with fixed rational clock slacks and smaller relative-height
    ceilings; it does not expose the endpoint rate or arbitrary clock
    coefficients. The pure fixed-multiplier critical target and all pointwise
    Collatz conclusions remain outside the theorem surface. Challenge.lean and
    Solution.lean use definitionally equal namespace-local definitions. The
    preceding Solution/Audit surface and its unselected dependencies remain in
    immutable Git history and the earlier Palomar record rather than in this
    Version 4 release cone.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    The author and Codex audited the selected statements against the Version 4
    manuscript and source declarations, built the complete transitive proof
    cone, and checked for admitted obligations and project-specific axioms. The
    preceding Palomar version passed its own independent workflow. This
    strengthened candidate requires a fresh mechanical and editorial review;
    no earlier Palomar result is treated as verification of these additions.
    No independent human peer review or journal acceptance is claimed here.

alignment:
  namespace: "CollatzFirstPassage"
  statements:
    - source: >-
        Version 4 Corollary 1.2(4), Proposition 6.5 and Corollary 6.6; source
        declaration
        FirstPassageLinearTransport.critical_polylogarithmic_descent_with_arbitrary_multipliers
      lean: "CollatzFirstPassage.critical_polylogarithmic_descent_with_arbitrary_multipliers"
      module: "Solution"
      status: "proved"
      note: >-
        Exposes arbitrary positive divergent multipliers without a monotonicity
        hypothesis, one common shortcut/raw landing, centered clocks, uniform
        shortcut/parity/raw tubes, both relative-height ceilings, and the
        actual shortcut/raw first-passage comparison at every intermediate
        level. It does not assert a bounded critical multiplier.
    - source: >-
        Version 4 Corollary 1.2(1); source declaration
        FirstPassageLinearTransport.fixed_polylogarithmic_common_landing_centered_clocks_exact_rate
      lean: "CollatzFirstPassage.fixed_polylogarithmic_common_landing_centered_clocks_exact_rate"
      module: "Solution"
      status: "proved"
      note: >-
        Exposes the exact endpoint upper rate q = kappa_* A - 1/2, common
        shortcut/raw landing, centered clocks, and balanced height allowance.
        Its target is C (log n)^A; the manuscript's constant-one normalization
        is not part of this selected declaration.
    - source: >-
        Version 4 Proposition 8.1 and joint-sharpness consequence; source
        declaration
        FirstPassageLinearTransport.eventually_fixedJointPolylogHeightFailureCount_ge_log_order
      lean: "CollatzFirstPassage.eventually_fixedJointPolylogHeightFailureCount_ge_log_order"
      module: "Solution"
      status: "proved"
      note: >-
        Gives an explicit eventual lower bound of reciprocal logarithmic order
        for failure of the simultaneous target-and-shortcut-height predicate.
        The obstruction is forced by the height ceiling and is not a
        target-only lower bound.
    - source: >-
        Version 4 Theorem 1.3 and Corollary 1.4, selected strict-rate
        projection; source declaration
        FirstPassageLinearTransport.stretchedLogCommonLandingWithRelativeHeightQuantitative
      lean: "CollatzFirstPassage.stretchedLogCommonLandingWithRelativeHeightQuantitative"
      module: "Solution"
      status: "proved"
      note: >-
        Exposes every strict 0 < sigma < 1-delta, a common shortcut/raw
        landing, fixed clocks 6953/1000 and 261/25, quantitative exceptional
        count, and both n exp(zeta (log n)^(1-delta)) ceilings. The endpoint
        sigma = 1-delta and arbitrary-clock formulation remain outside this
        selected declaration.

