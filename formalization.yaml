version: "v0.4"

project:
  name: "Polylogarithmic Descent for Almost All Collatz Orbits in Natural Density"
  description: >-
    A Lean 4 formalization of four almost-all descent results for shortcut
    Collatz orbits in ordinary natural density: a general moving-endpoint
    first-passage theorem with a quantitative dyadic-shell error profile; the
    fixed-exponent polylogarithmic specialization with the full explicit
    entropy-margin exceptional-rate range; a stretched-logarithmic
    same-witness companion with a 6.953 log n clock and orbit ceiling; and a
    quantitative stretched-logarithmic exceptional count retaining every
    strict exponent sigma < 1 - delta.
  authors:
    - "Idris Ali Shaik (ORCID 0009-0009-9699-9712)"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Idris Ali Shaik (ORCID 0009-0009-9699-9712)"

classification:
  arxiv: ["math.NT", "math.LO"]
  msc2020: ["11B83", "37P99", "03B35"]

sources:
  - title: "Polylogarithmic Descent for Almost All Collatz Orbits in Natural Density"
    authors:
      - "Idris Ali Shaik"
    id: "doi:10.2139/ssrn.7290240"
    type: "paper"
    location: "https://doi.org/10.2139/ssrn.7290240"
    relationship: "formalizes"
    note: >-
      The submitted declarations cover the manuscript's general moving-endpoint
      producer (Theorem 1.1), exactly Corollary 1.2(1), a qualitative
      same-witness projection of the stretched-logarithmic companion theorem,
      and its separately formalized strict-exponent exceptional count.
      Corollary 1.2(1) retains every
      0 < gamma < kappa_*(A - A_FP), separate landing and exceptional
      constants, the logarithmic shortcut clock, and the orbit ceiling. The
      same-witness stretched declaration retains every 0 < delta < 1 and
      beta > 0 but uses the formal theorem's fixed 6.953 clock. The separate
      quantitative declaration proves the unclocked landing count
      5 X exp(-rate (log X)^sigma) for every 0 < sigma < 1 - delta. It does
      not assert the endpoint sigma = 1 - delta or combine this count with
      every clock c > 2/log(4/3) and the same-witness ceiling. The manuscript
      proof is self-contained; this package supplies supplementary kernel
      verification.
    license: "CC-BY-4.0"
    author_endorsement: "participated"
