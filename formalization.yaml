version: "v0.4"

project:
  name: "Polylogarithmic Descent for Almost All Collatz Orbits in Natural Density"
  description: >-
    A Lean 4 formalization of four strengthened almost-all results for shortcut
    and raw Collatz orbits in ordinary natural density: critical
    polylogarithmic descent with arbitrary positive divergent target and height
    multipliers, centered trajectory tubes, and actual first-passage clocks;
    the fixed-exponent common-landing theorem with the exact upper
    exceptional-rate endpoint; an explicit reciprocal-order lower bound forced
    by the joint height ceiling; and a quantitative stretched-logarithmic
    common-landing theorem with smaller relative-height ceilings. These are
    almost-all statements and do not prove pointwise Collatz convergence.
  authors:
    - name: "Idris Ali Shaik"
      orcid: "0009-0009-9699-9712"
  license: "Apache-2.0"
  responsible_maintainers:
    - name: "Idris Ali Shaik"
      orcid: "0009-0009-9699-9712"

