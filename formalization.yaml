status:
  scope: >-
    Challenge.lean advertises four declarations. The critical theorem accepts
    arbitrary positive functions U and R tending to infinity and supplies a
    natural-density-one set with one common shortcut/raw landing below
    (log n)^A_FP U(n), centered shortcut and raw clocks, uniform shortcut,
    parity, and raw trajectory tubes, both n R(n) ceilings, and shortcut/raw
    first-passage comparisons for every intermediate level between the landing
    and n. The fixed-A theorem has the exact upper exponent
    q = kappa_*(A-A_FP) = kappa_* A - 1/2, a common landing, centered clocks,
    and balanced joint height ceiling. The third declaration is only a
    height-forced lower bound for failure of the joint target-and-height
    conclusion; it is not a target-only lower bound and does not prove
    optimality of A_FP. The stretched theorem retains every strict
    0 < sigma < 1-delta, one common shortcut/raw landing, fixed rational clock
    slacks 6953/1000 and 261/25, and both
    n exp(zeta (log n)^(1-delta)) ceilings. The selected surface does not expose
    the manuscript's target normalization to constant one, the stretched
    endpoint sigma = 1-delta, arbitrary stretched clocks, a pure critical
    target with bounded multiplier, pointwise convergence, or control after a
    selected witness.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "CollatzFirstPassage.critical_polylogarithmic_descent_with_arbitrary_multipliers"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "CollatzFirstPassage.fixed_polylogarithmic_common_landing_centered_clocks_exact_rate"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "CollatzFirstPassage.eventually_fixedJointPolylogHeightFailureCount_ge_log_order"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "CollatzFirstPassage.stretchedLogCommonLandingWithRelativeHeightQuantitative"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []

