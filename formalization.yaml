fidelity:
  divergences: >-
    The moving-endpoint declaration matches the manuscript's general
    first-passage producer, and the fixed-exponent declaration matches
    Corollary 1.2(1), including the complete strict gamma range and separate
    Ctar/Cexc constants. The same-witness stretched-logarithmic declaration is
    intentionally a qualitative projection: it keeps every 0 < delta < 1,
    natural density one, a same-witness landing and orbit ceiling, but exposes
    the formally proved fixed 6953/1000 clock. The separate quantitative
    declaration retains every strict 0 < sigma < 1 - delta and the explicit
    prefactor 5, but counts the unclocked landing predicate. It does not expose
    the manuscript's endpoint sigma = 1 - delta or its joint clock/ceiling
    predicate. The literal critical log-log/triple-log specializations are not
    public declarations in this package. All four are exposed through
    definitionally equivalent Challenge/Solution namespaces. The frozen proof
    cone and exact-rate wrapper were ported to Lean 4.33.0 using import-path,
    parser, elaboration, and tactic-compatibility edits only; their mathematical
    hypotheses and conclusions were not strengthened during the port.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    The author and Codex audited the four statements against the manuscript
    and frozen Lean exports, built the complete transitive proof cones, and
    checked for admitted obligations and project-specific axioms. The
    registered version-1 fixed theorem previously passed Palomar's independent
    Comparator/Landrun/NanoDa workflow. This expanded version must receive a
    fresh Comparator replay before registration. No independent human peer
    review or journal acceptance is claimed.

alignment:
  namespace: "CollatzFirstPassage"
  statements:
    - source: >-
        Preprint Theorem 1.1; Lean declaration
        FirstPassageLinearTransport.timeoutEndpointLiteralNaturalDensityDescent
      lean: "CollatzFirstPassage.moving_polylogarithmic_natural_density_descent"
      module: "Solution"
      status: "proved"
      note: >-
        Same bounded moving exponent profile, explicit entropy-buffer
        divergence hypothesis, logarithmic clock, same-witness orbit ceiling,
        natural-density-one conclusion, and dyadic-shell exceptional profile.
        Namespace-local definitions expose the formula without importing the
        proof library into Challenge.lean.
    - source: >-
        Preprint Corollary 1.2(1); Lean declaration
        FirstPassageLinearTransport.paper_cor12_item1_fixed_polylog
      lean: "CollatzFirstPassage.polylogarithmic_natural_density_descent"
      module: "Solution"
      status: "proved"
      note: >-
        Same hypotheses and conclusions, including every strict exceptional
        exponent below kappa_*(A - A_FP) and separate landing and exceptional
        constants, with only namespace-local, definitionally equal names for
        the shortcut map, orbit, bad count, natural density one, logarithmic
        ratio, binary entropy, kappa_*, and A_FP.
    - source: >-
        Preprint Theorem 1.3 companion; Lean declaration
        FirstPassageLinearTransport.firstPassageLinearTransportOrbitCeiling
      lean: "CollatzFirstPassage.stretched_logarithmic_descent_with_orbit_ceiling"
      module: "Solution"
      status: "proved"
      note: >-
        Faithful qualitative projection for every 0 < delta < 1 and beta > 0:
        natural density one, a landing at exp((log n)^(1-delta)), and an orbit
        ceiling through the same witness. The declaration states the proof
        library's fixed 6953/1000 clock and does not itself include the paper's
        endpoint exceptional-count estimate or arbitrary-clock refinement.
    - source: >-
        Preprint Theorem 1.3 companion; Lean declaration
        FirstPassageLinearTransport.firstPassageLinearTransportQuantitativeStretched
      lean: "CollatzFirstPassage.stretched_logarithmic_quantitative_exceptional_count"
      module: "Solution"
      status: "proved"
      note: >-
        Formally proved quantitative companion for every strict
        0 < sigma < 1 - delta, with eventual bound
        5 X exp(-rate (log X)^sigma) on the unclocked landing failure count.
        It is weaker than the manuscript's endpoint exponent 1 - delta and is
        not a joint statement with the clock or same-witness orbit ceiling.

