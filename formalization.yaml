status:
  scope: >-
    Challenge.lean advertises four declarations. The moving-endpoint theorem
    accepts a uniformly bounded shell-dependent exponent profile whose explicit
    entropy buffer tends to infinity and gives both a natural-density-one
    same-witness set and a quantitative dyadic-shell exceptional ratio. The
    fixed-exponent theorem gives, for every A above the explicit first-passage
    entropy threshold, c above 2/log(4/3), beta > 0, and every
    0 < gamma < kappa_*(A - A_FP), separate positive landing and exceptional
    constants and the eventual O(X (log X)^(-gamma)) exceptional count. The
    same-witness stretched-logarithmic theorem gives every 0 < delta < 1 and
    beta > 0 with the formalized fixed 6.953 log n clock and orbit ceiling.
    The separate quantitative stretched theorem gives, for every
    0 < sigma < 1 - delta, an eventual bound
    5 X exp(-rate (log X)^sigma) for the unclocked landing failure count. The
    package does not advertise the manuscript's literal critical log-log and
    triple-log specializations, the stretched theorem's endpoint
    sigma = 1 - delta, one joint quantitative predicate with arbitrary clock
    c > 2/log(4/3) and the same-witness ceiling, the unaccelerated-map clock
    conversion, or any pointwise Collatz assertion. It does not exclude
    exceptional cycles or divergent orbits.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "CollatzFirstPassage.moving_polylogarithmic_natural_density_descent"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "CollatzFirstPassage.polylogarithmic_natural_density_descent"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "CollatzFirstPassage.stretched_logarithmic_descent_with_orbit_ceiling"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "CollatzFirstPassage.stretched_logarithmic_quantitative_exceptional_count"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []

